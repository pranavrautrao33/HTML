<!DOCTYPE html>
<html>
    <head>
        <title>Html Unordered List Example</title>
    </head>
    <body>
        <h1>Cricket Equipment</h1>
        <ul>
            <li>Cricket Bat</li>
            <li>Wicketkeepering Gloves</li>
            <li>Cricket ball</li>
            <li>Cricket Helmet</li>
            <li>Cricket pads</li>
            <li>Cricket Stumps</li>
            <li>Cricket Shoes</li>
            <br>
            <br>
            <br>
            <br>
            <hr>
            <hr>



            <h2>Types of Unorderd list</h2>
            <ul type="disc">
                <li>Disc</li>
            </ul>
            <ul type="circle">
                <li>Circle</li>
            </ul>
            <ul type="square">
                <li>Square</li>
            </ul>

        </ul>
    </body>
</html>
