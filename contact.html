<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="index.html">Company</a>
			<nav class="site-nav">
				<a href="index.html">Home</a>
				<a href="about.html">About</a>
				<a href="contact.html" aria-current="page">Contact</a>
			</nav>
		</div>
	</header>

	<main class="container">
		<section class="contact-hero">
			<h1>Get in touch</h1>
			<p>Have questions? Send us a message and we'll respond as soon as we can.</p>
		</section>

		<section class="contact-grid">
			<form id="contactForm" class="contact-form" action="#" method="post">
				<div class="form-row">
					<label for="name">Name</label>
					<input id="name" name="name" type="text" required>
				</div>
				<div class="form-row">
					<label for="email">Email</label>
					<input id="email" name="email" type="email" required>
				</div>
				<div class="form-row">
					<label for="subject">Subject</label>
					<input id="subject" name="subject" type="text">
				</div>
				<div class="form-row">
					<label for="message">Message</label>
					<textarea id="message" name="message" rows="6" required></textarea>
				</div>
				<div class="form-actions">
					<button type="submit" class="btn">Send Message</button>
				</div>
				<p id="formMsg" class="form-msg" aria-live="polite"></p>
			</form>

			<aside class="contact-info">
				<h2>Contact Info</h2>
				<p><strong>Address:</strong><br>123 Main St, Anytown, USA</p>
				<p><strong>Phone:</strong> <a href="tel:+11234567890">(123) 456-7890</a></p>
				<p><strong>Email:</strong> <a href="mailto:hello@example.com">hello@example.com</a></p>

				<div class="map-wrap">
					<!-- Replace src with your map embed -->
					<iframe
						src="https://maps.google.com/maps?q=New%20York&t=&z=13&ie=UTF8&iwloc=&output=embed"
						loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
				</div>
			</aside>
		</section>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>&copy; <span id="year"></span> Company — All rights reserved.</p>
		</div>
	</footer>

	<script>
		document.getElementById('year').textContent = new Date().getFullYear();

		const form = document.getElementById('contactForm');
		const msg = document.getElementById('formMsg');

		form.addEventListener('submit', function (e) {
			e.preventDefault();
			// Basic client-side validation
			const name = form.name.value.trim();
			const email = form.email.value.trim();
			const message = form.message.value.trim();

			if (!name || !email || !message) {
				msg.textContent = 'Please fill in the required fields.';
				msg.classList.add('error');
				return;
			}

			// Simulate submission
			msg.textContent = 'Sending…';
			msg.classList.remove('error');

			setTimeout(() => {
				msg.textContent = 'Thanks! Your message has been sent.';
				form.reset();
			}, 800);
		});
	</script>
</body>
</html>
