<!DOCTYPE HTML>
<html>
    <head>
        <title>HTML Table Example</title>
    </head>
    <body>
        <table border="1">
            <caption>Legend Cricketers Information</caption>
            <thead>
                <tr>
                    <th>Player Name</th>
                    <th>Test avg</th>
                    <th>ODI avg</th>
                    <th>T20i avg</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>MS Dhoni</td>
                     <td>38.09</td>
                     <td>50.57</td>
                     <td>37.60</td>
                </tr>
                <tr>
                    <td>Rohit Sharma</td>
                     <td>40.57</td>
                     <td>48.91</td>
                     <td>32.22</td>
                    
                </tr>

                 <tr>
                    <td>Hardik Pandya</td>
                    <td>31.09</td>
                    <td>32.83</td>
                    <td>28.25</td>
                 </tr>
            </tbody>
        </table>
    </body>
</html>
